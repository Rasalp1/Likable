<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Likable</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="logo-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M3 10h18M10 10v11"/></svg></div>
        <div class="brand-text">
          <h1>Likable</h1>
          <span class="version">v1.1.0</span>
        </div>
      </div>
      <button type="button" class="status-indicator" id="bridge-status-indicator" title="Refresh connection status" aria-label="Refresh connection status">
        <span class="status-dot ping"></span>
        <span id="bridge-status-text" aria-live="polite">Checking…</span>
      </button>
    </header>

    <!-- Main Status Card -->
    <div class="status-card">
      <div class="status-row">
        <span class="label">Local bridge</span>
        <span class="value" id="val-bridge">127.0.0.1:3030</span>
      </div>
      <div class="status-row">
        <span class="label">Claude Code</span>
        <span class="value" id="val-claude">Checking...</span>
      </div>
      <div class="status-row">
        <span class="label">Codex</span>
        <span class="value" id="val-codex">Checking...</span>
      </div>
    </div>

    <section class="token-card">
      <label for="bridge-token">Bridge token</label>
      <div class="token-row">
        <input id="bridge-token" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your bridge token">
        <button id="save-bridge-token" class="btn-secondary" type="button">Save</button>
      </div>
      <p id="token-status" aria-live="polite">Start the bridge, then paste the token printed in its terminal.</p>
    </section>

    <div class="visibility-row">
      <div><label for="overlay-toggle">Show page controls</label><p>Floating button on this tab</p></div>
      <label class="switch"><input id="overlay-toggle" type="checkbox" role="switch" checked disabled><span class="switch-track" aria-hidden="true"></span></label>
    </div>
    <div id="action-alert" role="alert" style="display: none;"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
