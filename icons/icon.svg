<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <filter id="fab-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <linearGradient id="surface-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f7" />
    </linearGradient>
  </defs>

  <!-- Frosted glass button tile matching .designify-mini-fab-btn -->
  <g filter="url(#fab-shadow)">
    <rect x="10" y="8" width="108" height="108" rx="34" fill="url(#surface-grad)" />
    <rect x="10.5" y="8.5" width="107" height="107" rx="33.5" stroke="#000000" stroke-opacity="0.08" stroke-width="1" />
  </g>

  <!-- Centered HUD launcher layout mark (.designify-launcher-mark) -->
  <g transform="translate(32.8, 30.8) scale(2.6)" stroke="#2c2c2e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="3" y="3" width="18" height="18" rx="5" />
    <path d="M3 10h18M10 10v11" />
  </g>
</svg>
